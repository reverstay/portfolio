<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </radialGradient>
    <linearGradient id="pcbG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9e5b"/><stop offset="1" stop-color="#1c6b3c"/></linearGradient>
    <linearGradient id="pcbB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d3a4f"/><stop offset="1" stop-color="#1b2433"/></linearGradient>
    <linearGradient id="pcbR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8322a"/><stop offset="1" stop-color="#7e1f19"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d8de"/><stop offset=".5" stop-color="#9aa1ab"/><stop offset="1" stop-color="#6b7280"/></linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f46"/><stop offset="1" stop-color="#1f2227"/></linearGradient>
    <linearGradient id="lidarTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glowO" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="aO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a524"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6ee7a8"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <!-- motor DC com roda -->
    <g id="motor">
      <rect x="0" y="22" width="96" height="56" rx="12" fill="url(#metal)" stroke="#1f2227" stroke-width="3"/>
      <rect x="0" y="22" width="22" height="56" rx="6" fill="#4b5563" stroke="#1f2227" stroke-width="3"/>
      <rect x="96" y="44" width="16" height="12" fill="#9aa1ab" stroke="#1f2227" stroke-width="2"/>
      <circle cx="146" cy="50" r="46" fill="#1f2227" stroke="#0b0c0f" stroke-width="3"/>
      <circle cx="146" cy="50" r="30" fill="#f5a524" stroke="#1f2227" stroke-width="3"/>
      <circle cx="146" cy="50" r="8" fill="#1f2227"/>
      <g stroke="#1f2227" stroke-width="4" stroke-linecap="round"><path d="M146,24 V36"/><path d="M146,64 V76"/><path d="M120,50 H132"/><path d="M160,50 H172"/></g>
    </g>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>

  <!-- título -->
  <text x="836" y="78" text-anchor="middle" font-size="54" font-weight="700" fill="#f6d9a8" filter="url(#glowO)">Robô autônomo com LiDAR</text>
  <text x="836" y="116" text-anchor="middle" font-size="24" fill="#f5a524">Arquitetura ilustrada</text>
  <rect x="796" y="130" width="80" height="5" rx="2.5" fill="#f5a524"/>

  <!-- ===== conexões ===== -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <!-- LiDAR -> Raspberry -->
    <path d="M200,300 V372" stroke="#6ee7a8" marker-end="url(#aG)"/>
    <!-- Raspberry -> mapa -->
    <path d="M430,372 V300" stroke="#6ee7a8" marker-end="url(#aG)"/>
    <!-- Raspberry <-> ESP32 -->
    <path d="M555,470 H705" stroke="#f5a524" marker-start="url(#aO)" marker-end="url(#aO)"/>
    <!-- IMU -> ESP32 -->
    <path d="M845,300 V372" stroke="#60a5fa" marker-end="url(#aB)"/>
    <!-- ESP32 -> ponte H -->
    <path d="M990,470 H1110" stroke="#f5a524" marker-end="url(#aO)"/>
    <!-- ponte H -> motores -->
    <path d="M1300,440 C1350,400 1370,330 1410,320" stroke="#f5a524" marker-end="url(#aO)"/>
    <path d="M1300,500 C1350,540 1370,610 1410,620" stroke="#f5a524" marker-end="url(#aO)"/>
    <!-- encoders -> ESP32 -->
    <path d="M1500,680 C1500,740 1200,740 900,700 L880,588" stroke="#60a5fa" stroke-dasharray="2 12" marker-end="url(#aB)"/>
  </g>

  <!-- alimentação -->
  <g fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9">
    <!-- bateria -> step-down -->
    <path d="M745,840 H600" marker-end="url(#aR)"/>
    <!-- step-down -> Raspberry -->
    <path d="M430,790 V610" marker-end="url(#aR)"/>
    <!-- bateria -> ponte H -->
    <path d="M985,840 H1205 V585" marker-end="url(#aR)"/>
  </g>

  <!-- rótulos das conexões -->
  <g font-size="17" font-weight="600" text-anchor="middle">
    <rect x="560" y="402" width="140" height="56" rx="10" fill="#1a1406" stroke="#f5a524" stroke-width="2"/>
    <text x="630" y="425" fill="#f6d9a8">velocidade ↓</text>
    <text x="630" y="447" fill="#f6d9a8">odometria ↑</text>

    <rect x="995" y="402" width="110" height="34" rx="10" fill="#1a1406" stroke="#f5a524" stroke-width="2"/>
    <text x="1050" y="425" fill="#f6d9a8">PWM</text>

    <rect x="216" y="320" width="120" height="34" rx="10" fill="#0b1a12" stroke="#6ee7a8" stroke-width="2"/>
    <text x="276" y="343" fill="#bff5d6">varredura</text>

    <rect x="1290" y="716" width="120" height="34" rx="10" fill="#0b1426" stroke="#60a5fa" stroke-width="2"/>
    <text x="1350" y="739" fill="#cfe3ff">encoders</text>

    <rect x="1040" y="822" width="90" height="34" rx="10" fill="#1f0c0c" stroke="#f87171" stroke-width="2"/>
    <text x="1085" y="845" fill="#fecaca">12 V</text>

    <rect x="448" y="682" width="76" height="34" rx="10" fill="#1f0c0c" stroke="#f87171" stroke-width="2"/>
    <text x="486" y="705" fill="#fecaca">5 V</text>
  </g>

  <!-- ===== LiDAR 2D ===== -->
  <g filter="url(#soft)" transform="translate(110,170)">
    <ellipse cx="90" cy="98" rx="86" ry="26" fill="#111827" stroke="#0b0c0f" stroke-width="3"/>
    <rect x="4" y="60" width="172" height="38" fill="#1f2937"/>
    <ellipse cx="90" cy="60" rx="86" ry="26" fill="#374151" stroke="#0b0c0f" stroke-width="3"/>
    <rect x="44" y="18" width="92" height="42" fill="url(#lidarTop)"/>
    <ellipse cx="90" cy="60" rx="46" ry="14" fill="#1f2937"/>
    <ellipse cx="90" cy="18" rx="46" ry="14" fill="#6b7280" stroke="#0b0c0f" stroke-width="3"/>
    <rect x="76" y="30" width="28" height="18" rx="4" fill="#ef4444"/>
  </g>
  <g fill="none" stroke="#6ee7a8" stroke-width="3" stroke-linecap="round" opacity=".75">
    <path d="M300,190 a40,40 0 0 1 0,50"/><path d="M316,176 a62,62 0 0 1 0,78"/>
    <path d="M100,190 a40,40 0 0 0 0,50"/><path d="M84,176 a62,62 0 0 0 0,78"/>
  </g>
  <text x="200" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#f3f4f6">LiDAR 2D</text>

  <!-- ===== mapa ===== -->
  <g filter="url(#soft)" transform="translate(360,180)">
    <rect width="150" height="110" rx="12" fill="#f3f4f6" stroke="#1f2227" stroke-width="3"/>
    <g fill="#1f2227"><rect x="14" y="14" width="122" height="7"/><rect x="14" y="14" width="7" height="82"/><rect x="14" y="89" width="80" height="7"/><rect x="129" y="14" width="7" height="50"/><rect x="70" y="40" width="7" height="55"/><rect x="94" y="64" width="42" height="7"/></g>
    <g fill="#9ca3af" opacity=".55"><rect x="22" y="22" width="47" height="66"/><rect x="78" y="22" width="50" height="41"/></g>
    <path d="M36,74 C46,46 92,52 108,34" fill="none" stroke="#f5a524" stroke-width="3" stroke-dasharray="5 5"/>
    <circle cx="108" cy="34" r="6" fill="#ef4444"/>
  </g>
  <text x="435" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#f3f4f6">Mapa 2D</text>

  <!-- ===== Raspberry Pi 4 ===== -->
  <g filter="url(#soft)" transform="translate(90,376)">
    <rect width="460" height="230" rx="18" fill="url(#pcbG)" stroke="#0e3d22" stroke-width="4"/>
    <g fill="#d4af37"><circle cx="18" cy="18" r="8"/><circle cx="442" cy="18" r="8"/><circle cx="18" cy="212" r="8"/><circle cx="442" cy="212" r="8"/></g>
    <g fill="#111"><rect x="40" y="10" width="200" height="12" rx="2"/></g>
    <g fill="#d4af37"><rect x="44" y="13" width="4" height="6"/><rect x="54" y="13" width="4" height="6"/><rect x="64" y="13" width="4" height="6"/><rect x="74" y="13" width="4" height="6"/><rect x="84" y="13" width="4" height="6"/><rect x="94" y="13" width="4" height="6"/><rect x="104" y="13" width="4" height="6"/><rect x="114" y="13" width="4" height="6"/><rect x="124" y="13" width="4" height="6"/><rect x="134" y="13" width="4" height="6"/></g>
    <rect x="368" y="40" width="80" height="54" rx="4" fill="url(#metal)"/>
    <rect x="368" y="110" width="80" height="44" rx="4" fill="url(#metal)"/>
    <rect x="368" y="168" width="80" height="44" rx="4" fill="url(#metal)"/>
  </g>
  <text x="225" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Raspberry Pi 4</text>
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="170" y="488" width="110" height="34" rx="17" fill="#0b0c0f" stroke="#f6d9a8" stroke-width="2"/>
    <text x="225" y="511" fill="#f6d9a8">Linux</text>
    <rect x="292" y="488" width="90" height="34" rx="17" fill="#0b0c0f" stroke="#f6d9a8" stroke-width="2"/>
    <text x="337" y="511" fill="#f6d9a8">ROS</text>
    <text x="276" y="568" fill="#e5f7ec" font-size="17">mapeamento · modo autônomo/manual</text>
  </g>

  <!-- ===== IMU ===== -->
  <g filter="url(#soft)" transform="translate(775,190)">
    <rect width="140" height="110" rx="12" fill="#2a3a8f" stroke="#141c4a" stroke-width="3"/>
    <rect x="46" y="32" width="48" height="48" rx="4" fill="#111"/>
    <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" fill="none"><path d="M70,56 V22"/><path d="M70,56 L104,56"/><path d="M70,56 L44,82"/></g>
  </g>
  <text x="845" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f4f6">Giroscópio + acelerômetro</text>

  <!-- ===== ESP32 ===== -->
  <g filter="url(#soft)" transform="translate(712,376)">
    <rect width="270" height="210" rx="16" fill="url(#pcbB)" stroke="#0b1220" stroke-width="4"/>
    <rect x="70" y="18" width="130" height="86" rx="6" fill="url(#metal)" stroke="#4b5563" stroke-width="2"/>
    <path d="M90,30 h20 v14 h20 v-14 h20 v14 h20" fill="none" stroke="#4b5563" stroke-width="3"/>
    <g fill="#d4af37"><rect x="10" y="20" width="10" height="6"/><rect x="10" y="40" width="10" height="6"/><rect x="10" y="60" width="10" height="6"/><rect x="10" y="80" width="10" height="6"/><rect x="10" y="100" width="10" height="6"/><rect x="10" y="120" width="10" height="6"/><rect x="10" y="140" width="10" height="6"/><rect x="10" y="160" width="10" height="6"/><rect x="250" y="20" width="10" height="6"/><rect x="250" y="40" width="10" height="6"/><rect x="250" y="60" width="10" height="6"/><rect x="250" y="80" width="10" height="6"/><rect x="250" y="100" width="10" height="6"/><rect x="250" y="120" width="10" height="6"/><rect x="250" y="140" width="10" height="6"/><rect x="250" y="160" width="10" height="6"/></g>
  </g>
  <text x="847" y="525" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">ESP32</text>
  <rect x="777" y="540" width="140" height="34" rx="17" fill="#0b0c0f" stroke="#f6d9a8" stroke-width="2"/>
  <text x="847" y="563" text-anchor="middle" font-size="18" font-weight="600" fill="#f6d9a8">FreeRTOS</text>

  <!-- ===== Ponte H ===== -->
  <g filter="url(#soft)" transform="translate(1115,376)">
    <rect width="185" height="200" rx="14" fill="url(#pcbR)" stroke="#4a110d" stroke-width="4"/>
    <g fill="#111"><rect x="20" y="22" width="145" height="70" rx="6"/></g>
    <g fill="#2b2b2b" stroke="#4b5563" stroke-width="2"><rect x="30" y="34" width="24" height="46"/><rect x="62" y="34" width="24" height="46"/><rect x="94" y="34" width="24" height="46"/><rect x="126" y="34" width="24" height="46"/></g>
    <g fill="#2563eb"><rect x="20" y="150" width="40" height="34" rx="3"/><rect x="125" y="150" width="40" height="34" rx="3"/></g>
  </g>
  <text x="1207" y="512" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Ponte H</text>

  <!-- ===== Motores DC ===== -->
  <g filter="url(#soft)">
    <use href="#motor" transform="translate(1418,270)"/>
    <use href="#motor" transform="translate(1418,570)"/>
  </g>
  <text x="1530" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f4f6">Motor DC esquerdo</text>
  <text x="1530" y="550" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f4f6">Motor DC direito</text>

  <!-- ===== Step-down ===== -->
  <g filter="url(#soft)" transform="translate(345,790)">
    <rect width="250" height="100" rx="14" fill="#1d4ed8" stroke="#0b1d55" stroke-width="3"/>
    <circle cx="52" cy="50" r="28" fill="#111" stroke="#4b5563" stroke-width="3"/>
    <rect x="96" y="28" width="40" height="44" rx="4" fill="#111"/>
    <rect x="146" y="30" width="92" height="40" rx="6" fill="#0b1d55"/>
  </g>
  <text x="537" y="851" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">step-down</text>
  <text x="470" y="922" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f4f6">Conversor 12 V → 5 V</text>

  <!-- ===== Bateria ===== -->
  <g filter="url(#soft)" transform="translate(750,790)">
    <rect width="230" height="100" rx="14" fill="url(#bat)" stroke="#0b0c0f" stroke-width="3"/>
    <rect x="230" y="34" width="14" height="32" rx="3" fill="#6b7280"/>
    <rect x="16" y="18" width="70" height="64" rx="8" fill="#22c55e"/>
    <rect x="94" y="18" width="70" height="64" rx="8" fill="#22c55e"/>
    <rect x="172" y="18" width="42" height="64" rx="8" fill="#22c55e" opacity=".35"/>
  </g>
  <text x="865" y="780" text-anchor="middle" font-size="20" font-weight="700" fill="#f3f4f6">Bateria</text>

  <!-- legenda -->
  <g font-size="16" font-weight="600">
    <path d="M1300,800 H1340" stroke="#f5a524" stroke-width="5"/><text x="1352" y="806" fill="#d1d5db">controle</text>
    <path d="M1300,832 H1340" stroke="#6ee7a8" stroke-width="5"/><text x="1352" y="838" fill="#d1d5db">percepção / mapa</text>
    <path d="M1300,864 H1340" stroke="#60a5fa" stroke-width="5"/><text x="1352" y="870" fill="#d1d5db">sensores de movimento</text>
    <path d="M1300,896 H1340" stroke="#f87171" stroke-width="4" stroke-dasharray="10 7"/><text x="1352" y="902" fill="#d1d5db">alimentação</text>
  </g>
</svg>
